# Pri svakom pushu na main GitHub sam izgradi projekt i objavi ga na GitHub Pages.
# U repozitoriju: Settings -> Pages -> Source: GitHub Actions
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Izgradi projekt
        run: dotnet publish PM_Projeck.csproj -c Release -o out

      # Bez ovoga GitHub sakrije mapu _framework
      - name: Dodaj .nojekyll
        run: touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
